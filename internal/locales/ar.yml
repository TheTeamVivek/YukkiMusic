# Commands help
help_owner: |
  <h3>{emoji:👑} أوامر المالك</h3>
  <p><i>أدوات حصرية لإدارة المساعدين وتنفيذ أوامر النظام وإدارة المساعد الآلي بشكل آمن.</i></p>
  <table bordered striped compact>
  <tr><th>الأمر</th><th>الوصف</th></tr>
  <tr><td><code>/addsudo</code></td><td>إضافة مستخدم جديد لقائمة المساعدين</td></tr>
  <tr><td><code>/delsudo</code></td><td>إزالة مستخدم من قائمة المساعدين</td></tr>
  <tr><td><code>/blockuser</code></td><td>منع المستخدم من استخدام البوت</td></tr>
  <tr><td><code>/unblockuser</code></td><td>السماح للمستخدم باستخدام البوت مرة أخرى</td></tr>
  <tr><td><code>/blockchat</code></td><td>منع الدردشة من استخدام البوت</td></tr>
  <tr><td><code>/unblockchat</code></td><td>السماح للدردشة باستخدام البوت مرة أخرى</td></tr>
  <tr><td><code>/blacklisted</code></td><td>عرض القائمة السوداء العامة</td></tr>
  <tr><td><code>/maintenance</code></td><td>إدارة وضع الصيانة</td></tr>
  <tr><td><code>/restart</code></td><td>إعادة تشغيل المساعد الآلي</td></tr>
  <tr><td><code>/sh</code></td><td>تشغيل أوامر القشرة (Shell)</td></tr>
  </table>
  <footer>استخدم /help &lt;command&gt; للحصول على تفاصيل حول أي أمر.</footer>

help_sudo: |
  <h3>{emoji:⚡} أوامر المساعدين</h3>
  <p><i>أدوات متقدمة لإدارة سلوك المساعد ومراقبة الأداء والتحكم في السجلات والأتمتة.</i></p>
  <table bordered striped compact>
  <tr><th>الأمر</th><th>الوصف</th></tr>
  <tr><td><code>/active</code></td><td>عرض المحادثات النشطة</td></tr>
  <tr><td><code>/autoleave</code></td><td>تبديل المغادرة التلقائية</td></tr>
  <tr><td><code>/logger</code></td><td>تفعيل أو تعطيل السجل</td></tr>
  <tr><td><code>/stats</code></td><td>عرض إحصائيات النظام والمساعد</td></tr>
  <tr><td><code>/logs</code></td><td>الحصول على سجلات النظام</td></tr>
  <tr><td><code>/json</code></td><td>عرض بنية JSON للرسالة</td></tr>
  </table>
  <footer>استخدم /help &lt;command&gt; للحصول على تفاصيل حول أي أمر.</footer>

help_admin: |
  <h3>{emoji:🛠} أوامر المشرفين</h3>
  <p><i>أدوات التحكم في الموسيقى والتشغيل لمساعدة المشرفين على إدارة قائمة الانتظار والمحادثة الصوتية بسهولة.</i></p>
  <table bordered striped compact>
  <tr><th>الأمر</th><th>الوصف</th></tr>
  <tr><td><code>/playmode</code></td><td>التحكم في من يمكنه استخدام /play</td></tr>
  <tr><td><code>/cplay</code></td><td>التشغيل في المحادثة الصوتية للقناة المرتبطة</td></tr>
  <tr><td><code>/adminmode</code></td><td>التحكم في من يمكنه استخدام أوامر الإدارة</td></tr>
  <tr><td><code>/cmddelete</code></td><td>تبديل الحذف التلقائي لأوامر البوت</td></tr>
  <tr><td><code>/settings</code></td><td>تكوين إعدادات الدردشة</td></tr>
  <tr><td><code>/speed</code></td><td>تغيير سرعة التشغيل</td></tr>
  <tr><td><code>/skip</code></td><td>تخطي الأغنية الحالية</td></tr>
  <tr><td><code>/pause</code></td><td>إيقاف التشغيل الحالي مؤقتاً</td></tr>
  <tr><td><code>/resume</code></td><td>استئناف التشغيل المتوقف مؤقتاً</td></tr>
  <tr><td><code>/replay</code></td><td>إعادة تشغيل الأغنية الحالية</td></tr>
  <tr><td><code>/mute</code></td><td>كتم الصوت</td></tr>
  <tr><td><code>/unmute</code></td><td>إلغاء كتم الصوت</td></tr>
  <tr><td><code>/seek</code></td><td>التقديم بضع ثوانٍ</td></tr>
  <tr><td><code>/seekback</code></td><td>الإرجاع بضع ثوانٍ</td></tr>
  <tr><td><code>/jump</code></td><td>الانتقال إلى وقت معين في المقطع</td></tr>
  <tr><td><code>/move</code></td><td>نقل مقطع في قائمة الانتظار إلى موضع آخر</td></tr>
  <tr><td><code>/clear</code></td><td>حذف جميع الأغاني من قائمة الانتظار</td></tr>
  <tr><td><code>/remove</code></td><td>إزالة مقطع معين من قائمة الانتظار</td></tr>
  <tr><td><code>/shuffle</code></td><td>خلط جميع المقاطع في قائمة الانتظار</td></tr>
  <tr><td><code>/loop</code></td><td>تفعيل أو تعطيل التكرار</td></tr>
  <tr><td><code>/stop</code></td><td>إيقاف التشغيل ومغادرة المحادثة الصوتية</td></tr>
  <tr><td><code>/nothumb</code></td><td>تفعيل أو تعطيل الصورة المصغرة في رسائل التشغيل</td></tr>
  </table>
  <footer>استخدم /help &lt;command&gt; للحصول على تفاصيل حول أي أمر.</footer>

help_public: |
  <h3>{emoji:🌍} الأوامر العامة</h3>
  <p><i>ميزات لتشغيل الأغاني وعرض قوائم الانتظار والتحقق من التأخير والإبلاغ عن الأخطاء.</i></p>
  <table bordered striped compact>
  <tr><th>الأمر</th><th>الوصف</th></tr>
  <tr><td><code>/play</code></td><td>تشغيل أغنية</td></tr>
  <tr><td><code>/queue</code></td><td>عرض جميع المقاطع في قائمة الانتظار</td></tr>
  <tr><td><code>/ping</code></td><td>التحقق من تأخير شبكة البوت</td></tr>
  <tr><td><code>/start</code></td><td>بدء تشغيل البوت</td></tr>
  <tr><td><code>/help</code></td><td>عرض قائمة المساعدة</td></tr>
  <tr><td><code>/bug</code></td><td>الإبلاغ عن مشكلة أو خطأ</td></tr>
  <tr><td><code>/position</code></td><td>عرض التوقيت الحالي للمقطع</td></tr>
  <tr><td><code>/reload</code></td><td>إعادة تحميل بيانات المشرفين أو الذاكرة المؤقتة</td></tr>
  <tr><td><code>/sudolist</code></td><td>عرض قائمة المساعدين</td></tr>
  </table>


