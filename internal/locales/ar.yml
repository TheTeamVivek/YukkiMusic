# 🚫 Assistant Restricted / Banned
assistant_restricted_warning: |
  {emoji:⚠️} <b>الحساب المساعد مقيد</b>

  المساعد {assistant} (المعرف: <code>{id}</code>) <b>محظور</b> أو مقيد في هذه المحادثة.
  لا يمكنني تشغيل الموسيقى، أو إدارة قائمة الانتظار، أو تنظيف المسارات طالما استمر هذا الوضع.

  <i>قم بإلغاء حظر المساعد لاستعادة كافة ميزات الموسيقى {emoji:🎵}</i>

