start_private: |
  <h3>{emoji:🎵} {bot}</h3>
  <p>مرحباً {user} — أنا أبث الموسيقى في محادثات الصوت والفيديو على تيليجرام من YouTube و Spotify و SoundCloud و Apple Music وغيرها. تحكم في قائمة الانتظار والتكرار والخلط والتقديم والسرعة مع قائمة مباشرة.</p>
