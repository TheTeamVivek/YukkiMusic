  <p>تصفّح الأوامر حسب الفئة: <b>العامة</b> للجميع، و<b>المشرفين</b> و<b>المساعدين</b> و<b>المالك</b> لصلاحيات أعلى.</p>
  <aside>نصيحة: شغّل <code>/help &lt;command&gt;</code> للحصول على مساعدة مفصّلة لأي أمر.</aside>
  <footer><i>لأي مشاكل أو دعم، تواصل مع <a href="{support}">دردشة الدعم</a>.</i></footer>
