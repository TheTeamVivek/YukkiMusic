# Commands help
help_owner: |
  <h3>{emoji:👑} أوامر المالك</h3>
  <p><i>إدارة عامة للبوت مخصصة للمالك فقط.</i></p>
  <table bordered striped compact>
  <tr><th>الأمر</th><th>الوصف</th></tr>
  <tr><td><code>/addsudo</code></td><td>امنح مستخدماً صلاحية أوامر المساعدين — بالرد عليه أو بإرسال معرّفه.</td></tr>
  <tr><td><code>/delsudo</code></td><td>أزل صلاحية المساعد عن مستخدم.</td></tr>
  <tr><td><code>/blockuser</code></td><td>امنع مستخدماً من استخدام البوت في كل مكان.</td></tr>
  <tr><td><code>/unblockuser</code></td><td>أعِد الوصول لمستخدم محظور.</td></tr>
  <tr><td><code>/blockchat</code></td><td>امنع دردشة من استخدام البوت.</td></tr>
  <tr><td><code>/unblockchat</code></td><td>أعِد الوصول لدردشة محظورة.</td></tr>
  <tr><td><code>/blacklisted</code></td><td>اعرض كل المستخدمين والدردشات المحظورة.</td></tr>
  <tr><td><code>/broadcast</code></td><td>أرسل رسالة إلى جميع الدردشات والمستخدمين — بالرد على الرسالة للإذاعة.</td></tr>
  <tr><td><code>/maintenance</code></td><td>أوقف البوت وامنع كل الأوامر عدا المالك.</td></tr>
  <tr><td><code>/restart</code></td><td>أعد تشغيل البوت.</td></tr>
  <tr><td><code>/sh</code></td><td>نفّذ أمر قشرة (Shell) على الخادم.</td></tr>
  </table>
  <footer>استخدم /help &lt;command&gt; للحصول على تفاصيل حول أي أمر.</footer>

help_sudo: |
  <h3>{emoji:⚡} أوامر المساعدين</h3>
  <p><i>أدوات عامة للبوت للمراقبة والسجلات والأتمتة، متاحة للمساعدين.</i></p>
  <table bordered striped compact>
  <tr><th>الأمر</th><th>الوصف</th></tr>
  <tr><td><code>/active</code></td><td>اعرض كل المحادثات الصوتية التي يبثّ فيها البوت.</td></tr>
  <tr><td><code>/stats</code></td><td>اعرض إحصائيات مفصّلة للبوت والنظام وقاعدة البيانات.</td></tr>
  <tr><td><code>/logs</code></td><td>نزّل ملف السجل الحالي.</td></tr>
  <tr><td><code>/json</code></td><td>اعرض بنية JSON الخام لرسالة تم الرد عليها.</td></tr>
  <tr><td><code>/autoleave</code></td><td>غادر الدردشات غير النشطة تلقائياً.</td></tr>
  <tr><td><code>/logger</code></td><td>سجّل نشاط البوت في قناة السجل.</td></tr>
  </table>
  <footer>استخدم /help &lt;command&gt; للحصول على تفاصيل حول أي أمر.</footer>

help_admin: |
  <h3>{emoji:🛠} أوامر المشرفين</h3>
  <p><i>تحكم كامل في التشغيل والإعدادات لمشرفي الدردشة والمستخدمين المصرّح لهم.</i></p>

  <p><b>🎵 التشغيل</b></p>
  <table bordered striped compact>
  <tr><th>الأمر</th><th>الوصف</th></tr>
  <tr><td><code>/play</code></td><td>شغّل أغنية من بحث أو رابط أو ملف تم الرد عليه.</td></tr>
  <tr><td><code>/fplay</code></td><td>تشغيل قسري — ابدأ فوراً مع تخطّي قائمة الانتظار.</td></tr>
  <tr><td><code>/vplay</code></td><td>شغّل النتيجة كفيديو.</td></tr>
  <tr><td><code>/cplay</code></td><td>شغّل في المحادثة الصوتية للقناة المرتبطة.</td></tr>
  <tr><td><code>/pause</code></td><td>أوقف المقطع الحالي مؤقتاً.</td></tr>
  <tr><td><code>/resume</code></td><td>استأنف المقطع المتوقف مؤقتاً.</td></tr>
  <tr><td><code>/replay</code></td><td>أعِد تشغيل المقطع الحالي من البداية.</td></tr>
  <tr><td><code>/skip</code></td><td>انتقل إلى المقطع التالي في القائمة.</td></tr>
  <tr><td><code>/stop</code></td><td>أوقف التشغيل وامسح القائمة وغادر المحادثة الصوتية.</td></tr>
  <tr><td><code>/mute</code></td><td>اكتم صوت المساعد في المحادثة الصوتية.</td></tr>
  <tr><td><code>/unmute</code></td><td>ألغِ كتم صوت المساعد في المحادثة الصوتية.</td></tr>
  </table>

  <p><b>📜 قائمة الانتظار</b></p>
  <table bordered striped compact>
  <tr><th>الأمر</th><th>الوصف</th></tr>
  <tr><td><code>/queue</code></td><td>اعرض جميع المقاطع المنتظرة.</td></tr>
  <tr><td><code>/position</code></td><td>اعرض التوقيت الحالي.</td></tr>
  <tr><td><code>/remove</code></td><td>أزل مقطعاً معيناً من القائمة.</td></tr>
  <tr><td><code>/move</code></td><td>انقل مقطعاً في القائمة إلى موضع آخر.</td></tr>
  <tr><td><code>/clear</code></td><td>أزل كل المقاطع من القائمة.</td></tr>
  <tr><td><code>/shuffle</code></td><td>اخلط القائمة عشوائياً.</td></tr>
  <tr><td><code>/loop</code></td><td>كرّر المقطع الحالي من 0 إلى 10 مرات.</td></tr>
  <tr><td><code>/jump</code></td><td>انتقل مباشرة إلى موضع مختار في المقطع.</td></tr>
  </table>

  <p><b>⏩ التقديم والإرجاع والسرعة</b></p>
  <table bordered striped compact>
  <tr><th>الأمر</th><th>الوصف</th></tr>
  <tr><td><code>/seek</code></td><td>تقدّم بعدد الثواني المحدد.</td></tr>
  <tr><td><code>/seekback</code></td><td>أرجع للخلف بعدد الثواني المحدد.</td></tr>
  <tr><td><code>/speed</code></td><td>غيّر سرعة التشغيل (0.5x–4.0x).</td></tr>
  </table>

  <p><b>⚙️ الإعدادات والوصول</b></p>
  <table bordered striped compact>
  <tr><th>الأمر</th><th>الوصف</th></tr>
  <tr><td><code>/settings</code></td><td>افتح لوحة الإعدادات التفاعلية.</td></tr>
  <tr><td><code>/playmode</code></td><td>اختر من يمكنه استخدام /play.</td></tr>
  <tr><td><code>/adminmode</code></td><td>اختر من يمكنه استخدام أوامر الموسيقى الإدارية.</td></tr>
  <tr><td><code>/cmddelete</code></td><td>احذف رسائل الأوامر تلقائياً بعد تنفيذها.</td></tr>
  <tr><td><code>/autoplay</code></td><td>شغّل التوصيات تلقائياً عند انتهاء القائمة.</td></tr>
  <tr><td><code>/nothumb</code></td><td>أخفِ الصورة المصغّرة في رسائل التشغيل.</td></tr>
  <tr><td><code>/cleanmode</code></td><td>احذف ردود البوت في الدردشة تلقائياً.</td></tr>
  <tr><td><code>/channelplay</code></td><td>اربط قناة لوضع تشغيل القناة.</td></tr>
  <tr><td><code>/auth</code></td><td>صرّح لمستخدم بالتحكم في التشغيل.</td></tr>
  <tr><td><code>/delauth</code></td><td>أزل تصريح مستخدم.</td></tr>
  <tr><td><code>/reload</code></td><td>حدّث ذاكرة المشرفين وحالة المحادثة الصوتية.</td></tr>
  </table>
  <footer>صيغ القناة (مثل /cpause و/cskip) تعمل على المحادثة الصوتية للقناة المرتبطة.</footer>

help_public: |
  <h3>{emoji:🌍} الأوامر العامة</h3>
  <p><i>كل ما تحتاجه لتشغيل الموسيقى ومتابعة القائمة والاطلاع على حالة البوت.</i></p>
  <table bordered striped compact>
  <tr><th>الأمر</th><th>الوصف</th></tr>
  <tr><td><code>/play</code></td><td>شغّل أغنية من بحث أو رابط أو ملف تم الرد عليه.</td></tr>
  <tr><td><code>/queue</code></td><td>اعرض جميع المقاطع المنتظرة في القائمة.</td></tr>
  <tr><td><code>/position</code></td><td>اعرض مقدار ما تم تشغيله من المقطع الحالي.</td></tr>
  <tr><td><code>/ping</code></td><td>تحقق من تأخير البوت وحالة النظام.</td></tr>
  <tr><td><code>/reload</code></td><td>حدّث ذاكرة المشرفين وحالة المحادثة الصوتية.</td></tr>
  <tr><td><code>/authlist</code></td><td>اعرض المستخدمين المصرّح لهم في الدردشة.</td></tr>
  <tr><td><code>/sudolist</code></td><td>اعرض مستخدمي السودو في البوت.</td></tr>
  <tr><td><code>/language</code></td><td>غيّر لغة البوت.</td></tr>
  <tr><td><code>/privacy</code></td><td>اقرأ سياسة خصوصية البوت.</td></tr>
  <tr><td><code>/help</code></td><td>افتح قائمة المساعدة هذه.</td></tr>
  <tr><td><code>/start</code></td><td>ابدأ البوت في محادثة خاصة.</td></tr>
  </table>
  <footer>استخدم /help &lt;command&gt; للحصول على تفاصيل حول أي أمر.</footer>
cleanmode_title: "{emoji:🧹} وضع التنظيف"
cleanmode_desc: "عند التفعيل، يتم حذف رسائل الخدمة وأوامر البوت تلقائياً بعد تأخير قصير."
