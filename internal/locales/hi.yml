voicechat_started: "<b>{emoji:♻️} ध्वनि वार्तालाप आरम्भ!</b>\n\n<i>संगीत चलाने के लिए /play [गीत का नाम] का प्रयोग करें।</i>"

# Commands help
help_owner: |
  <h3>{emoji:👑} स्वामी आदेश</h3>
  <p><i>केवल स्वामी के लिए आरक्षित, पूरे बॉट के प्रबन्धन के आदेश।</i></p>
  <table bordered striped compact>
  <tr><th>आदेश</th><th>विवरण</th></tr>
  <tr><td><code>/addsudo</code></td><td>किसी उपयोगकर्ता को विशेषाधिकारी आदेशों की अनुमति दें — उन्हें उत्तर दें या आईडी भेजें।</td></tr>
  <tr><td><code>/delsudo</code></td><td>किसी उपयोगकर्ता की विशेषाधिकारी पहुँच हटाएँ।</td></tr>
  <tr><td><code>/blockuser</code></td><td>उपयोगकर्ता को हर जगह बॉट का उपयोग करने से रोकें।</td></tr>
  <tr><td><code>/unblockuser</code></td><td>अवरुद्ध उपयोगकर्ता की पहुँच बहाल करें।</td></tr>
  <tr><td><code>/blockchat</code></td><td>किसी चैट को बॉट का उपयोग करने से रोकें।</td></tr>
  <tr><td><code>/unblockchat</code></td><td>अवरुद्ध चैट की पहुँच बहाल करें।</td></tr>
  <tr><td><code>/blacklisted</code></td><td>सभी अवरुद्ध उपयोगकर्ताओं और चैट की सूची दिखाएँ।</td></tr>
  <tr><td><code>/broadcast</code></td><td>सभी सेवित चैट और उपयोगकर्ताओं को सन्देश भेजें — प्रसारण हेतु सन्देश को उत्तर दें।</td></tr>
  <tr><td><code>/maintenance</code></td><td>बॉट को रोकें और स्वामी के अतिरिक्त सभी आदेश अवरुद्ध करें।</td></tr>
  <tr><td><code>/restart</code></td><td>बॉट प्रक्रिया पुनः आरम्भ करें।</td></tr>
  <tr><td><code>/sh</code></td><td>सर्वर पर शेल आदेश चलाएँ।</td></tr>
  </table>
  <footer>किसी भी आदेश की जानकारी के लिए /help &lt;command&gt; का उपयोग करें।</footer>

help_sudo: |
  <h3>{emoji:⚡} विशेषाधिकारी आदेश</h3>
  <p><i>निगरानी, अभिलेखन और स्वचालन के लिए पूरे बॉट के साधन, विशेषाधिकारियों के लिए उपलब्ध।</i></p>
  <table bordered striped compact>
  <tr><th>आदेश</th><th>विवरण</th></tr>
  <tr><td><code>/active</code></td><td>बॉट जिन सभी ध्वनि वार्तालापों में चल रहा है उनकी सूची दिखाएँ।</td></tr>
  <tr><td><code>/stats</code></td><td>बॉट, प्रणाली और डेटाबेस के विस्तृत आँकड़े दिखाएँ।</td></tr>
  <tr><td><code>/logs</code></td><td>वर्तमान अभिलेख (log) फ़ाइल डाउनलोड करें।</td></tr>
  <tr><td><code>/json</code></td><td>उत्तर दिए गए सन्देश की कच्ची JSON संरचना दिखाएँ।</td></tr>
  <tr><td><code>/autoleave</code></td><td>निष्क्रिय चैट से स्वचालित रूप से प्रस्थान करें।</td></tr>
  <tr><td><code>/logger</code></td><td>बॉट की गतिविधि अभिलेखक चैनल में दर्ज करें।</td></tr>
  </table>
  <footer>किसी भी आदेश की जानकारी के लिए /help &lt;command&gt; का उपयोग करें।</footer>

help_admin: |
  <h3>{emoji:🛠} प्रशासक आदेश</h3>
  <p><i>चैट प्रशासकों और अधिकृत उपयोगकर्ताओं के लिए पूर्ण पुनःप्रसारण और विन्यास नियन्त्रण।</i></p>

  <p><b>🎵 पुनःप्रसारण</b></p>
  <table bordered striped compact>
  <tr><th>आदेश</th><th>विवरण</th></tr>
  <tr><td><code>/play</code></td><td>खोज शब्द, लिंक या उत्तर दिए गए फ़ाइल से गाना चलाएँ।</td></tr>
  <tr><td><code>/fplay</code></td><td>बलपूर्वक चलाएँ — प्रतीक्षा सूची छोड़कर तुरन्त आरम्भ करें।</td></tr>
  <tr><td><code>/vplay</code></td><td>परिणाम को वीडियो के रूप में चलाएँ।</td></tr>
  <tr><td><code>/cplay</code></td><td>सम्बद्ध चैनल के ध्वनि वार्तालाप में चलाएँ।</td></tr>
  <tr><td><code>/pause</code></td><td>वर्तमान गीत को विराम दें।</td></tr>
  <tr><td><code>/resume</code></td><td>विराम दिए गए गीत को पुनः आरम्भ करें।</td></tr>
  <tr><td><code>/replay</code></td><td>वर्तमान गीत को आरम्भ से पुनः चलाएँ।</td></tr>
  <tr><td><code>/skip</code></td><td>प्रतीक्षा सूची के अगले गीत पर जाएँ।</td></tr>
  <tr><td><code>/stop</code></td><td>पुनःप्रसारण रोकें, प्रतीक्षा सूची साफ़ करें और ध्वनि वार्तालाप छोड़ें।</td></tr>
  <tr><td><code>/mute</code></td><td>ध्वनि वार्तालाप में सहायक को निःशब्द करें।</td></tr>
  <tr><td><code>/unmute</code></td><td>ध्वनि वार्तालाप में सहायक को सशब्द करें।</td></tr>
  </table>

  <p><b>📜 प्रतीक्षा सूची</b></p>
  <table bordered striped compact>
  <tr><th>आदेश</th><th>विवरण</th></tr>
  <tr><td><code>/queue</code></td><td>प्रतीक्षा सूची के सभी गीत दिखाएँ।</td></tr>
  <tr><td><code>/position</code></td><td>वर्तमान समय-चिह्न दिखाएँ।</td></tr>
  <tr><td><code>/remove</code></td><td>प्रतीक्षा सूची से विशिष्ट गीत हटाएँ।</td></tr>
  <tr><td><code>/move</code></td><td>प्रतीक्षा सूची के गीत को अन्य स्थान पर ले जाएँ।</td></tr>
  <tr><td><code>/clear</code></td><td>प्रतीक्षा सूची से सभी गीत हटाएँ।</td></tr>
  <tr><td><code>/shuffle</code></td><td>प्रतीक्षा सूची को यादृच्छिक क्रम में करें।</td></tr>
  <tr><td><code>/loop</code></td><td>वर्तमान गीत को 0–10 बार दोहराएँ।</td></tr>
  <tr><td><code>/jump</code></td><td>गीत में चुने गए स्थान पर सीधे जाएँ।</td></tr>
  </table>

  <p><b>⏩ आगे/पीछे और गति</b></p>
  <table bordered striped compact>
  <tr><th>आदेश</th><th>विवरण</th></tr>
  <tr><td><code>/seek</code></td><td>दिए गए सेकण्ड आगे बढ़ें।</td></tr>
  <tr><td><code>/seekback</code></td><td>दिए गए सेकण्ड पीछे जाएँ।</td></tr>
  <tr><td><code>/speed</code></td><td>पुनःप्रसारण गति बदलें (0.5x–4.0x)।</td></tr>
  </table>

  <p><b>⚙️ विन्यास और पहुँच</b></p>
  <table bordered striped compact>
  <tr><th>आदेश</th><th>विवरण</th></tr>
  <tr><td><code>/settings</code></td><td>इंटरैक्टिव विन्यास पैनल खोलें।</td></tr>
  <tr><td><code>/playmode</code></td><td>चुनें कि /play का उपयोग कौन कर सकता है।</td></tr>
  <tr><td><code>/adminmode</code></td><td>चुनें कि प्रशासकीय संगीत आदेश कौन चला सकता है।</td></tr>
  <tr><td><code>/cmddelete</code></td><td>चलने के बाद आदेश सन्देश स्वचालित रूप से हटाएँ।</td></tr>
  <tr><td><code>/autoplay</code></td><td>प्रतीक्षा सूची समाप्त होने पर सुझाव स्वचालित रूप से चलाएँ।</td></tr>
  <tr><td><code>/nothumb</code></td><td>पुनःप्रसारण सन्देशों में कलाकृति छिपाएँ।</td></tr>
  <tr><td><code>/cleanmode</code></td><td>चैट में बॉट के उत्तर स्वचालित रूप से हटाएँ।</td></tr>
  <tr><td><code>/channelplay</code></td><td>चैनल प्ले विधा हेतु एक चैनल जोड़ें।</td></tr>
  <tr><td><code>/auth</code></td><td>किसी उपयोगकर्ता को पुनःप्रसारण नियन्त्रण की अनुमति दें।</td></tr>
  <tr><td><code>/delauth</code></td><td>किसी उपयोगकर्ता की अनुमति हटाएँ।</td></tr>
  <tr><td><code>/reload</code></td><td>प्रशासक कैश और ध्वनि वार्तालाप स्थिति ताज़ा करें।</td></tr>
  </table>
  <footer>चैनल रूप (जैसे /cpause, /cskip) सम्बद्ध चैनल के ध्वनि वार्तालाप पर लागू होते हैं।</footer>

help_public: |
  <h3>{emoji:🌍} सार्वजनिक आदेश</h3>
  <p><i>संगीत चलाने, प्रतीक्षा सूची देखने और बॉट की स्थिति जाँचने के लिए सब कुछ।</i></p>
  <table bordered striped compact>
  <tr><th>आदेश</th><th>विवरण</th></tr>
  <tr><td><code>/play</code></td><td>खोज शब्द, लिंक या उत्तर दिए गए फ़ाइल से गाना चलाएँ।</td></tr>
  <tr><td><code>/queue</code></td><td>प्रतीक्षा सूची में मौजूद सभी गाने देखें।</td></tr>
  <tr><td><code>/position</code></td><td>वर्तमान गाना कितना चल चुका है देखें।</td></tr>
  <tr><td><code>/ping</code></td><td>बॉट की विलम्बता और प्रणाली की स्थिति जाँचें।</td></tr>
  <tr><td><code>/reload</code></td><td>प्रशासक कैश और ध्वनि वार्तालाप स्थिति ताज़ा करें।</td></tr>
  <tr><td><code>/authlist</code></td><td>चैट के अधिकृत उपयोगकर्ताओं की सूची दिखाएँ।</td></tr>
  <tr><td><code>/sudolist</code></td><td>बॉट के विशेषाधिकारी उपयोगकर्ता दिखाएँ।</td></tr>
  <tr><td><code>/language</code></td><td>बॉट की भाषा बदलें।</td></tr>
  <tr><td><code>/privacy</code></td><td>बॉट की गोपनीयता नीति पढ़ें।</td></tr>
  <tr><td><code>/help</code></td><td>यह सहायता सूची खोलें।</td></tr>
  <tr><td><code>/start</code></td><td>निजी चैट में बॉट आरम्भ करें।</td></tr>
