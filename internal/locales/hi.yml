# ⚠️ Bot Demotion
bot_demotion_goodbye: |
  <b>{emoji:⚠️} अनुमति लुप्त</b>

  मुझे <b>प्रशासक पद से हटा</b> दिया गया है और अब मैं अपने कर्तव्यों का पालन नहीं कर सकता।
  उचित अधिकारों के बिना, मैं यहाँ कार्य करने में अक्षम हूँ, अतः मैं अब यह <i>वार्तालाप छोड़ रहा हूँ</i>।

  <b>अलविदा {emoji:👋}</b>

