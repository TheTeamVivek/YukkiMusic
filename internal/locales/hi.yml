skip_count_exceeds_queue: "{emoji:⚠️} आपने <code>{requested}</code> ट्रैक स्किप करने को कहा, लेकिन कतार में सिर्फ <code>{available}</code> ट्रैक है।"

speed_usage: |
  {emoji:💡} <b>प्रयोग:</b>
  <code>{cmd} [गति]</code> — चलाने की गति बदलें
  
  अनुमत गति सीमा: <b>0.50x → 4.00x</b>
  
  उदाहरण:
  <code>{cmd} 1.5</code> — 1.5x की गति से चलाएँ।
  <code>{cmd} normal</code> — सामान्य गति पर लौटें।

speed_current: "{emoji:🎧} <b>वर्तमान गति:</b> {emoji:🎵} <u>{title}</u> के लिए <code>{speed}x</code>\n\n{emoji:💡} सामान्य गति पर लौटने के लिए <code>{cmd} reset</code> का प्रयोग करें।"

speed_invalid_value: "{emoji:❌} अमान्य गति मान।\nउदाहरण: <code>{cmd} 1.5</code> या <code>{cmd} 2x</code>"
speed_invalid_range: "{emoji:⚠️} गति <b>0.50x</b> और <b>4.00x</b> के मध्य होनी चाहिए।"

speed_already_set: "ℹ️ {emoji:🎵} <b>{title}</b> के लिए चलाने की गति पूर्व से ही <b>{speed}x</b> है।"

speed_failed: |
  {emoji:❌} गति को <b>{speed}x</b> में बदलने में विफल।
  त्रुटि: <code>{error}</code>

speed_reset_success: "{emoji:✅} {user} द्वारा चलाने की गति <b>1.0x</b> पर पुनर्निर्धारित"

speed_set: "{emoji:🚀} {user} द्वारा चलाने की गति <b>{speed}x</b> निर्धारित।"

start_private: |
  <h3>{emoji:🎵} {bot}</h3>
  <p>नमस्ते {user} — मैं आपके टेलीग्राम वॉइस और वीडियो चैट में YouTube, Spotify, SoundCloud, Apple Music और बहुत कुछ से संगीत स्ट्रीम करता हूँ। लाइव क्यू के साथ क्यू, लूप, शफल, सीक और स्पीड नियंत्रण करें।</p>
  <p><b>बेहतरीन ऑडियो क्वालिटी, तेज़ डाउनलोड और हर चैट में स्मूद प्लेबैक का आनंद लें।</b></p>
  <footer><i>मुझे जोड़ने या कमांड देखने के लिए नीचे के बटन दबाएँ।</i></footer>

start_group: "<b>{emoji:💫} मैं यहाँ हूँ!</b> कोई आदेश दें... यदि आपको लगता है कि आप मुझे नियन्त्रित कर सकते हैं {emoji:😉}"

stream_queue_finished: "{emoji:🎵} <b>प्रतीक्षा सूची समाप्त!</b>\n\nचलाने के लिए कोई और गीत नहीं है। अधिक संगीत जोड़ने के लिए /play का प्रयोग करें! {emoji:🎶}"
stream_downloading_next: "{emoji:📥} आपका अगला संगीत अभिलेखित किया जा रहा है..."
