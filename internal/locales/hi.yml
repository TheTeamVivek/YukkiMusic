# basically this string used in /command [bool]

adminmode_help: |
  {emoji:🛡️} <b>प्रशासकीय आदेश विधा</b>

  <b>स्थिति:</b> {status}
  <b>प्रयोग:</b> <code>/adminmode [admin|adminauth|everyone]</code>
adminmode_status_admin: "प्रशासक 🔐"
adminmode_status_adminauth: "अधिकृत उपयोगकर्ता 🎧"
adminmode_status_everyone: "प्रत्येक व्यक्ति 🌍"
adminmode_updated: "{emoji:✅} <b>प्रशासकीय आदेश विधा</b> अद्यतन की गई: {status}"
adminmode_invalid: "{emoji:⚠️} अमान्य विधा। प्रयोग करें: <code>admin</code>, <code>adminauth</code>, अथवा <code>everyone</code>।"

# 🚫 Assistant Restricted / Banned
assistant_restricted_warning: |
  {emoji:⚠️} <b>सहायक प्रतिबन्धित</b>

  सहायक {assistant} (परिचय पत्र: <code>{id}</code>) इस वार्तालाप में <b>वर्जित</b> या प्रतिबन्धित कर दिया गया है।
  जब तक यह स्थिति बनी रहेगी, मैं संगीत नहीं चला सकता, प्रतीक्षा सूची का प्रबन्धन नहीं कर सकता, या संगीत संचिकाओं को हटा नहीं सकता।

  <i>संगीत की समस्त सुविधाओं को पुनर्स्थापित करने के लिए सहायक को वर्जित सूची से हटाएँ {emoji:🎵}</i>

# 🧩 Common auth messages
